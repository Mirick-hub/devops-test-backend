name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Завантажуємо ваш код на сервер GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Перевіряємо, чи збирається Docker-образ без помилок
      - name: Build Docker Image
        run: docker build -t fast-backend .